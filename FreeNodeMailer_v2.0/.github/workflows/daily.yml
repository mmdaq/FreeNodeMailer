name: FreeNodeMailer

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:00 执行 (UTC 00:00)
    - cron: "0 0 * * *"

env:
  PYTHONIOENCODING: utf-8
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'FreeNodeMailer_v2.0/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r FreeNodeMailer_v2.0/requirements.txt

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Run fetch and speed test
        id: fetch
        run: |
          python FreeNodeMailer_v2.0/scripts/fetch.py
          echo "proxy_count=$(grep -c 'server:' FreeNodeMailer_v2.0/output/clash.yaml || echo 0)" >> $GITHUB_OUTPUT

      - name: Send email notification
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH: ${{ secrets.QQ_AUTH }}
        run: |
          python FreeNodeMailer_v2.0/scripts/send_email.py

      - name: Commit and push if changed
        run: |
          git add FreeNodeMailer_v2.0/output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto-update nodes: ${{ steps.fetch.outputs.proxy_count }} proxies ($(date +%Y-%m-%d %H:%M))"
            git push
          fi

      - name: Notify success
        if: success()
        run: |
          echo "✅ FreeNodeMailer completed successfully."
          echo "Proxies: ${{ steps.fetch.outputs.proxy_count }}"
          echo "Subscribe URL: https://raw.githubusercontent.com/${{ github.repository }}/main/FreeNodeMailer_v2.0/output/clash.yaml"

      - name: Notify failure
        if: failure()
        run: echo "❌ FreeNodeMailer failed. Check logs."
