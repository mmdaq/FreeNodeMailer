mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9097
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 168
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - +.qq.com
  - +.wechat.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - 223.5.5.5
  nameserver-policy:
    geosite:cn,private:
    - https://223.5.5.5/dns-query
    - 223.5.5.5
    geosite:geolocation-!cn:
    - https://1.12.12.12/dns-query
    - tls://8.8.8.8:853
