  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - +.qq.com
  - +.wechat.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - 223.5.5.5
  nameserver-policy:
    geosite:cn,private:
    - https://223.5.5.5/dns-query
    - 223.5.5.5
    geosite:geolocation-!cn:
    - https://1.12.12.12/dns-query
    - tls://8.8.8.8:853
