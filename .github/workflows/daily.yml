name: FreeNodeMailer

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:00 执行 (UTC 00:00)
    - cron: "0 0 * * *"

env:
  PYTHONIOENCODING: utf-8
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Run fetch and speed test
        id: fetch
        run: |
          set +e
          python scripts/fetch.py || true
          echo "proxy_count=$(grep -c 'server:' output/clash.yaml 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Create fallback output if needed
        run: |
          if [ ! -f output/clash.yaml ] || [ ! -s output/clash.yaml ]; then
            echo "Creating fallback output..."
            mkdir -p output
            echo "proxies: []" > output/clash.yaml
            echo "<html><body><h2>今日无可用节点</h2></body></html>" > output/report.html
            echo "proxy_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH: ${{ secrets.QQ_AUTH }}
        run: |
          set +e
          python scripts/send_email.py || true

      - name: Commit and push if changed
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto-update nodes: ${{ steps.fetch.outputs.proxy_count }} proxies ($(date +%Y-%m-%d %H:%M))"
            git push || true
          fi
