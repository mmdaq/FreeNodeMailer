name: FreeNodeMailer

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  PYTHONIOENCODING: utf-8
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Run fetch and speed test
        id: fetch
        run: |
          set +e
          python scripts/fetch.py || true
          echo "proxy_count=$(grep -c 'server:' output/clash.yaml 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Create fallback output if needed
        run: |
          if [ ! -f output/clash.yaml ] || [ ! -s output/clash.yaml ]; then
            echo "Creating fallback output..."
            mkdir -p output
            echo "proxies: []" > output/clash.yaml
            echo "<html><body><h2>浠婃棩鏃犲彲鐢ㄨ妭鐐?/h2></body></html>" > output/report.html
            echo "proxy_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH: ${{ secrets.QQ_AUTH }}
        run: |
          set +e
          python scripts/send_email.py || true

      - name: Commit and push if changed
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "馃攧 Auto-update nodes: ${{ steps.fetch.outputs.proxy_count }} proxies ($(date +%Y-%m-%d %H:%M))"
            # 閲嶈瘯3娆ush
            for i in 1 2 3; do
              git push && break || sleep 10
            done
          fi

      - name: Fallback upload via API if git push failed
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y%m%d)
          if [ -f "output/${TODAY}clash.yaml" ]; then
            CONTENT=$(base64 -w0 "output/${TODAY}clash.yaml")
            SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/output/${TODAY}clash.yaml" | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)
            curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/output/${TODAY}clash.yaml" \
              -d "{\"message\":\"Auto-update clash config $TODAY\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
          fi
          if [ -f "output/clash.yaml" ]; then
            CONTENT=$(base64 -w0 "output/clash.yaml")
            SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/output/clash.yaml" | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)
            curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/output/clash.yaml" \
              -d "{\"message\":\"Auto-update clash config\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
          fi
          if [ -f "output/report.html" ]; then
            CONTENT=$(base64 -w0 "output/report.html")
            SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/output/report.html" | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)
            curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/output/report.html" \
              -d "{\"message\":\"Auto-update report\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
          fi
